<!doctype html>
<html lang="PT-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style/index.css" />
        <link rel="stylesheet" href="style/navbar.css" />
        <link rel="stylesheet" href="style/cards.css" />
        <link rel="stylesheet" href="style/dialog.css" />
        <title>Movin</title>
    </head>
    <body>
        <!--nav bar-->
        <nav>
            <div class="nav">
                <div class="container_nav">
                    <div class="logo">
                        <img src="Img/logo movin.png" />
                        <h1>ovin</h1>
                    </div>

                    <div class="link">
                        <a class="button active" href="index.html"
                            >Meus Treinos</a
                        >
                        <a class="button" href="src/NovoTreino.html">Nova Sessão</a>
                    </div>
                </div>
            </div>
        </nav>

        <header>
            <h1>Treinos Salvos</h1>
            <section>
                <div class="card">
                    <div class="container_card">
                        <div class="text_card">
                            <h2>Segunda</h2>
                            <p>3 Exercicios</p>
                        </div>
                        <div class="button_card">
                            <button>></button>
                        </div>
                    </div>
                </div>
                <a href="src/NovoTreino.html">
                <div class="cardAdd">
                    <div class="container_add">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                        >
                            <path
                                d="M12.0601 16.5V11.5"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-miterlimit="10"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                            <path
                                d="M14.5 14H9.5"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-miterlimit="10"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                            <path
                                d="M22 11V17C22 21 21 22 17 22H7C3 22 2 21 2 17V7C2 3 3 2 7 2H8.5C10 2 10.33 2.44 10.9 3.2L12.4 5.2C12.78 5.7 13 6 14 6H17C21 6 22 7 22 11Z"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-miterlimit="10"
                            />
                        </svg>
                        <p>Adicionar Novo Card</p>
                    </div>
                </div>
                </a>
            </section>
        </header>



        <div class="dialog-overlay" id="dialogOverlay">
            <div class="dialog" id="dialog">
                <div class="dialog-header">
                    <h2 id="dialogTitle">Segunda Feira</h2>
                    <div class="dialog-header-actions">
                        <button class="dialog-btn-edit" id="dialogBtnEdit">Editar</button>
                        <button class="dialog-btn-close" id="dialogClose">✕</button>
                    </div>
                </div>
                <div class="dialog-body">
                    <div class="exercise-table">
                        <div class="exercise-table-header">
                            <span>Nome do Exercício</span>
                            <span>Séries</span>
                            <span>Repetições</span>
                            <span>Kg</span>
                            <span></span>
                        </div>

                        <div class="exercise-row">
                            <div class="cell-name">
                                <span class="field-view exercise-name">Press Inclinado</span>
                                <input type="text" class="field-edit exercise-input" value="Press Inclinado" />
                            </div>
                            <div class="cell-val">
                                <span class="field-view exercise-val">3</span>
                                <input type="number" class="field-edit exercise-input exercise-input--small" value="3" min="1" />
                            </div>
                            <div class="cell-val">
                                <span class="field-view exercise-val">10</span>
                                <input type="number" class="field-edit exercise-input exercise-input--small" value="10" min="1" />
                            </div>
                            <input type="number" class="exercise-kg" value="60" min="0" />
                            <div class="exercise-row-actions">
                                <div class="actions-view">
                                    <button class="btn-x">✕</button>
                                    <button class="btn-check">✓</button>
                                </div>
                                <div class="actions-edit">
                                    <button class="btn-delete-exercise">Excluir</button>
                                </div>
                            </div>
                        </div>

                        <div class="exercise-row">
                            <div class="cell-name">
                                <span class="field-view exercise-name">Rosca Direta</span>
                                <input type="text" class="field-edit exercise-input" value="Rosca Direta" />
                            </div>
                            <div class="cell-val">
                                <span class="field-view exercise-val">3</span>
                                <input type="number" class="field-edit exercise-input exercise-input--small" value="3" min="1" />
                            </div>
                            <div class="cell-val">
                                <span class="field-view exercise-val">10</span>
                                <input type="number" class="field-edit exercise-input exercise-input--small" value="10" min="1" />
                            </div>
                            <input type="number" class="exercise-kg" value="60" min="0" />
                            <div class="exercise-row-actions">
                                <div class="actions-view">
                                    <button class="btn-x">✕</button>
                                    <button class="btn-check">✓</button>
                                </div>
                                <div class="actions-edit">
                                    <button class="btn-delete-exercise">Excluir</button>
                                </div>
                            </div>
                        </div>

                        <div class="exercise-row">
                            <div class="cell-name">
                                <span class="field-view exercise-name">Puxada Frontal</span>
                                <input type="text" class="field-edit exercise-input" value="Puxada Frontal" />
                            </div>
                            <div class="cell-val">
                                <span class="field-view exercise-val">3</span>
                                <input type="number" class="field-edit exercise-input exercise-input--small" value="3" min="1" />
                            </div>
                            <div class="cell-val">
                                <span class="field-view exercise-val">12</span>
                                <input type="number" class="field-edit exercise-input exercise-input--small" value="12" min="1" />
                            </div>
                            <input type="number" class="exercise-kg" value="55" min="0" />
                            <div class="exercise-row-actions">
                                <div class="actions-view">
                                    <button class="btn-x">✕</button>
                                    <button class="btn-check">✓</button>
                                </div>
                                <div class="actions-edit">
                                    <button class="btn-delete-exercise">Excluir</button>
                                </div>
                            </div>
                        </div>

                        <button class="btn-add-exercise" id="btnAddExercise">+ Adicionar Exercício</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="Js/dialog.js"></script>
    </body>
</html>
